{% extends "base.html" %}
{% block title %}Регистрация · SkillSwap{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Создайте аккаунт ✨</h2>
    <p class="sub">Присоединяйтесь к SkillSwap: учитесь у других и обучайте сами.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block btn-lg">Создать аккаунт</button>
    </form>

    <p class="alt">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
  </div>
</div>
{% endblock %}
