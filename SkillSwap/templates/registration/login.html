{% extends "base.html" %}
{% block title %}Вход · SkillSwap{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>С возвращением 👋</h2>
    <p class="sub">Войдите, чтобы записываться на занятия и делиться навыками.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block btn-lg">Войти</button>
    </form>

    <p class="alt">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
